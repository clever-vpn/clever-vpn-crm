# ↓↓↓ 本地开发：CRM（clever-vpn-crm）
#     源文件维护在仓库 scripts/local/Caddyfile.crm.conf，改那边记得同步到
#     /opt/homebrew/etc/Caddyfile 并 `caddy reload --config /opt/homebrew/etc/Caddyfile`
#
#     crm.clever-vpn.org
#       /api/*、/pay/*、/_crm/*、/__version、/health、/unsubscribe
#                 → 127.0.0.1:8788  CRM Worker（`wrangler dev`）
#       其余（/、/plans、/settings、/admin* 全是 SPA 路由）
#                 → 127.0.0.1:5181  Vite dev server（`npm run dev:web`，HMR）
#     app-web.clever-vpn.org
#       → 127.0.0.1:5180  App 的本地模拟端（`npm run dev:app-web`，纯静态）
#
#     为什么按路径分流：管理后台是 SPA，开发时让它跑在 Vite（HMR），但**接口必须打到真 Worker**
#     —— 否则 cookie、CSRF 头、错误信封都跟线上不一样。同一域名下分流 ⇒ 同源、零 CORS。
#
#     ⚠️ 上游写法的既有不对称（2026-10-02 实测两次）：
#        · wrangler dev 绑 **IPv4** ⇒ 写 `127.0.0.1`
#        · Node 静态服务（dev-app-web.mjs）显式 listen **IPv4** ⇒ 也写 `127.0.0.1`
#        · Vite dev 在 macOS 上可能只绑 `[::1]` ⇒ 这里写 `localhost`（先试 IPv6 再回落）
#     ⚠️ 两个域名必须在 /etc/hosts 里钉到 127.0.0.1，否则 *.clever-vpn.org 会解析到线上。
#     ⚠️ hosts 生效后本机就**够不到线上** crm.clever-vpn.org；核对线上版本要用
#        `curl --resolve`（见 docs/local-dev.md）。
#     💡 想看**编译后的产物**（而不是 dev server）：`npm run build:web` 后直接开
#        http://127.0.0.1:8788/admin/ （绕过 Caddy，走 Worker 的 assets）。

crm.clever-vpn.org {
        tls {
                issuer internal {
                        sign_with_root
                }
        }

        # Worker：接口与后端页面（回调、退订、mock 支付页、版本、健康检查）
        @worker path /api/* /pay/* /_crm/* /__version /health /unsubscribe
        handle @worker {
                reverse_proxy 127.0.0.1:8788
        }

        # 其余：管理后台 dev server（HMR）。面板入口是 `/`，SPA 路由（/plans、
        # /settings…）都归 Vite；`/admin/*` 也给 Vite（老地址由 Worker 302，dev
        # 里直接让 SPA 接即可）。
        handle {
                reverse_proxy localhost:5181
        }
}

app-web.clever-vpn.org {
        tls {
                issuer internal {
                        sign_with_root
                }
        }
        reverse_proxy 127.0.0.1:5180
}
