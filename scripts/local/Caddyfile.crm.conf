# ↓↓↓ 本地开发：CRM（clever-vpn-crm）
#     源文件维护在仓库 scripts/local/Caddyfile.crm.conf，改那边记得同步到
#     /opt/homebrew/etc/Caddyfile 并 `caddy reload --config /opt/homebrew/etc/Caddyfile`
#
#     crm.clever-vpn.org      = CRM Worker（`./node_modules/.bin/wrangler dev` :8788，管理后台 + /api/app/v1）
#     app-web.clever-vpn.org  = App 的本地模拟端（`npm run dev:app-web` :5180，纯静态）
#
#     ⚠️ 上游写法的既有不对称（2026-10-02 实测两次）：
#        · wrangler dev 绑 **IPv4** ⇒ 写 `127.0.0.1`
#        · Node 静态服务按本脚本绑 **IPv4** ⇒ 也写 `127.0.0.1`
#        （本文件里的 Vite 块用 `localhost`，是因为 Node 在 macOS 上会把 localhost 解析成 [::1]；
#         我们的 dev-app-web.mjs 显式 listen 127.0.0.1，所以别抄 `localhost`。）
#     ⚠️ 两个域名必须在 /etc/hosts 里钉到 127.0.0.1，否则 *.clever-vpn.org 会解析到线上。
#     ⚠️ hosts 生效后本机就**够不到线上** crm.clever-vpn.org；排查线上版本要用
#        `curl --resolve`（见 docs/local-dev.md）。

crm.clever-vpn.org {
        tls {
                issuer internal {
                        sign_with_root
                }
        }
        reverse_proxy 127.0.0.1:8788
}

app-web.clever-vpn.org {
        tls {
                issuer internal {
                        sign_with_root
                }
        }
        reverse_proxy 127.0.0.1:5180
}
