name: release

# 打 tag（v*）→ 产出可复现的部署产物（Worker bundle + 迁移资产 + 示例配置）。
# 部署本身走 `deploy-*.yml`（CI 直接 wrangler deploy），不经过这里。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      # `wrangler deploy` 会校验 `assets.directory`（= web/dist）是否存在，
      # 而 web/dist 是构建产物、不入库 —— 不先构建就直接挂在 dry-run 上。
      - name: Build web assets
        run: npm run build:web

      - name: Build worker bundle
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Package release assets
        run: |
          cp dist/index.js crm-worker.mjs
          cp wrangler.example.jsonc .
          # 迁移资产（给 cf-api 建租户库用）：整文件 sql + 内容寻址 schema_version
          node scripts/pack-migrations.mjs --dir migrations --out migrations.json
          sha256sum crm-worker.mjs wrangler.example.jsonc migrations.json > checksums.txt
          cat checksums.txt

      # 版本号不写进 bundle：托管侧上传时以 plain_text 绑定 CRM_CODE_VERSION，
      # 自托管则在 wrangler.jsonc 里配置 —— 保持"同一份字节、不同配置"。
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            crm-worker.mjs wrangler.example.jsonc migrations.json checksums.txt
