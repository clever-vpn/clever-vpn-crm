name: release

# 发布事件（由部署 workflow 的 _release-publish 创建）→ 给该 release 挂可复现产物。
#
# **tag/release 不由这里创建**：版本由部署决定（见 skill `release-crm` 与 docs/release.md），
# tag 必须等于线上 worker 自报的版本。这里只负责"把产物传到已经存在的 release 上"。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      # `wrangler deploy` 会校验 `assets.directory`（= web/dist）是否存在，
      # 而 web/dist 是构建产物、不入库 —— 不先构建就直接挂在 dry-run 上。
      - name: Build web assets
        run: npm run build:web

      - name: Build worker bundle
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Package release assets
        run: |
          set -euo pipefail
          cp dist/index.js crm-worker.mjs
          sha256sum crm-worker.mjs wrangler.example.jsonc > checksums.txt
          cat checksums.txt

      - name: Upload assets to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" crm-worker.mjs wrangler.example.jsonc checksums.txt --clobber
