name: release

# 打 tag（v*）→ 产出可部署产物，托管侧（clever-vpn-crm-saas）下载同一份字节上传到 WfP。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      - name: Build worker bundle
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Package release assets
        run: |
          cp dist/index.js crm-worker.mjs
          cp wrangler.example.jsonc .
          sha256sum crm-worker.mjs wrangler.example.jsonc > checksums.txt
          cat checksums.txt

      # 版本号不写进 bundle：托管侧上传时以 plain_text 绑定 CRM_CODE_VERSION，
      # 自托管则在 wrangler.jsonc 里配置 —— 保持"同一份字节、不同配置"。
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            crm-worker.mjs wrangler.example.jsonc checksums.txt
