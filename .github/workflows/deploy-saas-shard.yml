# 部署 **SaaS 分片（shard-N）** —— 代码走 CI，绑定走 cf-api
#
# 命名约定：`deploy-saas-<用途>.yml`。带 `saas` 的前提是"只有托管模式才用"，
# 因为同一份代码在单租户自部署里走的是 `deploy.yml`（租户 fork 自己跑）。
#   deploy-saas-shard.yml   本文件：shard-N
#   deploy-saas-site.yml    site-serve（站点出口，零 D1）
#   deploy-saas-router.yml  router（*.根域名 → shard，service binding）
#
# 契约：clever-vpn-docs/docs/contracts/cf-api-hosting.md §4.5
#
# 为什么是这个形状：
#   1. `wrangler deploy` 是**连绑定一起提交**的。若 CI 取完清单再部署，期间 cf-api
#      又 PATCH 加了一条 DB_<slot>，旧清单会把那条绑定抹掉 = 静默解绑、该租户立刻
#      500。所以 deploy 前后各取一次清单，最后以 registry 为准再 PATCH 一次。
#   2. 部署期间**暂停开通**（pause），只挡开通/补池，不挡服务。
#   3. `resume` 必须 `if: always()`，否则部署失败就把开通永久锁在外面；暂停本身还有
#      90 分钟自动过期兜底（workflow 被取消时唯一的救援）。
#   4. 要发哪些片**由 cf-api 判定**（GET /platform/shards 的 next_shard），本文件不
#      算水位 —— 两处规则必然漂移。
name: deploy-saas-shard

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "要部署的分片号（留空 = 让 cf-api 判断该发哪些片）"
        required: false
        default: ""
        type: string
      reason:
        description: "审计备注（会写进 registry 的 pause_reason）"
        required: false
        default: "manual"
        type: string
  schedule:
    # 每天 04:17 UTC 检查一次是否要加新片（2000 租户/片，低频）
    - cron: "17 4 * * *"

permissions:
  contents: read

env:
  CF_API_BASE: https://api.clever-vpn.org
  # 分片脚本名与库名的推导在 cf-api 侧（manifest.worker / bindings），这里不重复

jobs:
  # ---- 1. 问 cf-api：该发哪些片 ----
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.decide.outputs.has_work }}
      matrix: ${{ steps.decide.outputs.matrix }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Load SERVICE_TOKEN from Bitwarden (SM)
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_SERVICE_TOKEN }} > SERVICE_TOKEN

      - name: Ask cf-api which shards to deploy
        id: decide
        env:
          SHARD_INPUT: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          if [[ -z "${SERVICE_TOKEN:-}" ]]; then
            echo "::error::SERVICE_TOKEN 为空（检查 BW_SECRET_ID_SERVICE_TOKEN）"
            exit 1
          fi

          resp=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            "$CF_API_BASE/api/v2/platform/shards")
          echo "cf-api: $resp"

          if [[ -n "$SHARD_INPUT" ]]; then
            # 人工指定：不猜，直接发这一片
            list=$(jq -c --arg s "$SHARD_INPUT" '[{shard: ($s|tonumber)}]' <<<"$resp")
            echo "reason=manual: $SHARD_INPUT" >> "$GITHUB_OUTPUT"
          else
            # 自动模式：下一片（容量水位到了）+ 任何"有绑定却没版本记录"的片
            list=$(jq -c '
              ([.next_shard] | map(select(. != null)))
              + ([.shards[] | select(.deployed == false) | .shard])
              | unique | map({shard: .})
            ' <<<"$resp")
            jq -r '.reason' <<<"$resp" > /tmp/reason.txt
            echo "reason=$(cat /tmp/reason.txt)" >> "$GITHUB_OUTPUT"
          fi

          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"
          count=$(jq 'length' <<<"$list")
          if [[ "$count" -gt 0 ]]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "无需部署（cf-api: $(jq -r '.reason' <<<"$resp")）"
          fi

  # ---- 2. 逐片部署 ----
  deploy:
    name: deploy shard-${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    # 同一片不允许并发部署（重复 PATCH settings 会互相覆盖）
    concurrency:
      group: deploy-saas-shard-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      WORKER: clever-vpn-crm-saas-shard-${{ matrix.shard }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      # 这些必须在**作业级**：渲染配置与"刷新绑定"两步都会跑
      # scripts/render-shard-config.mjs，只在一步里给会导致后一步崩
      # （实测：Refresh bindings 报「缺 HOSTS_KV_ID」）
      HOSTS_KV_ID: ${{ vars.HOSTS_KV_ID }}
      CRM_CODE_VERSION: ${{ github.sha }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Load secrets from Bitwarden (SM)
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_SERVICE_TOKEN }} > SERVICE_TOKEN
            ${{ vars.BW_SECRET_ID_CLOUDFLARE_API_TOKEN }} > CLOUDFLARE_API_TOKEN

      # APP_SECRET —— **唯一的主密钥**：HMAC（退订链接 / mock 回调）+ AES-GCM
      # （网关密钥 / 商店凭据 / cf-api token）。两个用途用派生后不同的字节。
      # ⚠️ 定了就不能再换：换掉 = 已发出的退订链接失效 + 已存的密钥全部解不开。
      - name: Load APP_SECRET from Bitwarden (SM)
        if: vars.BW_SECRET_ID_APP_SECRET != ''
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_APP_SECRET }} > APP_SECRET

      # ---- 2.1 暂停开通（挡开通与补池，不挡服务）----
      - name: Pause provisioning
        id: pause
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"minutes\":90,\"reason\":\"deploy:${{ github.run_id }}\"}" \
            "$CF_API_BASE/api/v2/platform/shards/$SHARD/pause"

      # ---- 2.2 取清单 → 渲染配置 ----
      - name: Fetch manifest
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            "$CF_API_BASE/api/v2/platform/shards/$SHARD/manifest" > manifest.json
          jq -r '"\(.worker) 现有绑定 \(.bindings|length) 条"' manifest.json

      - name: Render wrangler.shard.jsonc + settings.json
        env:
          # 想临时关掉测试网关：把仓库变量 ALLOW_MOCK_PAYMENTS 设成 false
          ALLOW_MOCK_PAYMENTS: ${{ vars.ALLOW_MOCK_PAYMENTS }}
        run: node scripts/render-shard-config.mjs --manifest manifest.json

      # ---- 2.2.1 迁移扇出：**先迁移、再部署** ----
      # 分片里所有租户共用一份代码，但每个租户一个 D1；漏迁移的表现是
      # "新功能一上线就 500（no such table）"，而不是部署失败。
      # `d1_migrations` 表记录已应用项，重复执行安全；迁移只允许向后兼容的追加。
      - name: Apply tenant migrations（逐库）
        run: |
          set -euo pipefail
          mapfile -t DBS < <(jq -r '.bindings[].database_name' manifest.json)
          echo "将在 ${#DBS[@]} 个库上应用迁移：${DBS[*]}"
          for db in "${DBS[@]}"; do
            echo "── $db"
            npx wrangler d1 migrations apply "$db" --remote --config wrangler.shard.jsonc
          done

      # ---- 2.3 构建 + 部署 ----
      - run: npm ci
      - run: npm run build:web
      - name: Deploy worker
        run: npx wrangler deploy --config wrangler.shard.jsonc

      # ---- 2.3.1 同步 APP_SECRET（worker 已存在；wrangler deploy 不会动 secrets）----
      - name: Sync APP_SECRET to shard
        run: |
          set -euo pipefail
          if [[ -z "${APP_SECRET:-}" ]]; then
            echo "::warning::APP_SECRET 未配置（变量 BW_SECRET_ID_APP_SECRET 未设置）—— 签名与加密都不可用"
            exit 0
          fi
          printf '%s' "$APP_SECRET" | npx wrangler secret put APP_SECRET --config wrangler.shard.jsonc
          echo "✔ APP_SECRET 已写入（值不打印）"
          # 历史残留清理（旧的两把已并入 APP_SECRET；不存在也无所谓）
          for legacy in SIGNING_SECRET PAYMENT_SECRET_KEY; do
            npx wrangler secret delete "$legacy" --config wrangler.shard.jsonc >/dev/null 2>&1 \
              && echo "✔ 已清理历史 secret $legacy" || true
          done

      # ---- 2.4 以 registry 为准再刷一次绑定 ----
      # 做法是「拿最新清单再 wrangler deploy 一次」，**不是** PATCH settings。
      # 原因：Workers 里 vars 就是 plain_text 类型的 binding，而 PATCH settings 的
      # bindings 是整体替换 —— 只提交 KV+D1 会把 MODE/SHARD 等 vars 全删掉，worker
      # 直接退回 MODE=single 且无 DB（实测踩过）。re-deploy 走同一条代码路径，既刷
      # 绑定又保留 vars 与 secrets。
      - name: Refresh bindings from registry (re-deploy)
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            "$CF_API_BASE/api/v2/platform/shards/$SHARD/manifest" > manifest.final.json
          node scripts/render-shard-config.mjs --manifest manifest.final.json >/dev/null
          npx wrangler deploy --config wrangler.shard.jsonc

      # ---- 2.4.1 核对：按**名字**核对关键绑定，而不是只比数量 ----
      # （只比数量会在"数量相同但内容被换掉"时静默通过 —— 上一次就是 1 == 1）
      - name: Verify key bindings
        run: |
          set -euo pipefail
          json=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER/settings")
          names=$(jq -r '.result.bindings[].name' <<<"$json" | sort | tr '\n' ' ')
          echo "现状 bindings：$names"
          for want in HOSTS MODE SHARD; do
            jq -e --arg n "$want" '.result.bindings[] | select(.name == $n)' <<<"$json" >/dev/null \
              || { echo "::error::缺绑定 $want（很可能被 PATCH settings 抹掉了）"; exit 1; }
          done
          # vars 必须是 plain_text，否则等于没有
          jq -e '.result.bindings[] | select(.name == "MODE" and .type == "plain_text" and .text == "multi")' <<<"$json" >/dev/null \
            || { echo "::error::MODE 不是 plain_text=multi"; exit 1; }
          d1=$(jq '[.result.bindings[] | select(.type == "d1")] | length' <<<"$json")
          want_d1=$(jq '.bindings | length' manifest.final.json)
          echo "D1 绑定：期望 $want_d1 / 实际 $d1"
          [[ "$want_d1" == "$d1" ]] || { echo "::error::D1 绑定数量不一致（漏绑 = 静默解绑）"; exit 1; }

      # ---- 2.5 回写版本（cron 据此不再重发这一片）----
      - name: Record deployed version
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"code_version\":\"${{ github.sha }}\"}" \
            "$CF_API_BASE/api/v2/platform/shards/$SHARD/deployed"

      # ---- 2.6 恢复开通（无论前面成败都要跑）----
      - name: Resume provisioning
        if: always() && steps.pause.outcome == 'success'
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"reason\":\"deploy:done:${{ github.run_id }}\"}" \
            "$CF_API_BASE/api/v2/platform/shards/$SHARD/resume" \
            || echo "::warning::resume 失败 —— 暂停会在 90 分钟后自动过期"
