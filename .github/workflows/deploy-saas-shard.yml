# 部署 **SaaS 分片（shard-N）** —— 只负责**代码**；绑定由 cf-api 自己写。
#
# 一次发布 = 对每个已建好的片做四件事：
#   stale（清 bound_at，部署期间这些位号暂不可分配）
#   → 取清单 → 部署代码（含当时清单里的全部 DB_<slot>）
#   → reconcile（cf-api 用 PATCH settings 把绑定拉回一致并回读核对，写完恢复 bound_at）
#
# 为什么不再 pause/resume、不再双重部署：绑定不再由这里负责落地。CI 的整份 deploy
# 仍然是"全量替换"，所以它照样要带上清单；但任何偏差都由 reconcile 在几秒内修好，
# 不需要冻结开通，也不需要再部署一次。
#
# 契约：clever-vpn-docs/docs/contracts/services/cf-api/hosting.md §4.5
name: deploy-saas-shard

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "审计备注"
        required: false
        default: "manual"
        type: string
      shard:
        description: "只发这一片（留空 = 全部已建好的片）"
        required: false
        default: ""
        type: string
      tag:
        description: "可选：已存在的 release tag（如 v1.2.0）。留空 = 自动解析（见 skill release-crm）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CF_API_BASE: https://api.clever-vpn.org

jobs:
  # ---- 0. 解析版本（共享 workflow）----
  resolve:
    uses: ./.github/workflows/_release-tag.yml
    with:
      tag: ${{ inputs.tag }}

  # ---- 1. 问 cf-api：现在有哪些片 ----
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      has_work: ${{ steps.decide.outputs.has_work }}
    steps:
      - name: Load SERVICE_TOKEN from Bitwarden (SM)
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_SERVICE_TOKEN }} > SERVICE_TOKEN

      - name: Fetch shard summary
        id: decide
        env:
          SHARD_INPUT: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          resp=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            "$CF_API_BASE/api/v2/platform/shards")
          echo "$resp" | jq -c '{shards_ready, needs_shard, capacity_left, shards: [.shards[] | {shard, assigned, pooled}]}'

          if [[ -n "${SHARD_INPUT:-}" ]]; then
            list=$(jq -c --arg s "$SHARD_INPUT" '[{shard: ($s|tonumber)}]' <<<"$resp")
          else
            # 一次发布要让**所有已建好的片**都跑到同一版代码
            list=$(jq -c '[.shards[] | {shard}]' <<<"$resp")
          fi
          count=$(jq 'length' <<<"$list")
          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"
          if [[ "$count" -gt 0 ]]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "::warning::cf-api 说一片都没有（先跑 ensure-shard 建 shard-0）"
          fi

  # ---- 2. 逐片部署 ----
  deploy:
    name: deploy shard-${{ matrix.shard }}
    needs: [plan, resolve]
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-saas-shard-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      WORKER: clever-vpn-crm-saas-shard-${{ matrix.shard }}
      HOSTS_KV_ID: ${{ vars.HOSTS_KV_ID }}
      STUDIO_SITE_URL: ${{ vars.STUDIO_SITE_URL }}
      SITES_ROOT: ${{ vars.SITES_ROOT }}
      CRM_CODE_VERSION: ${{ needs.resolve.outputs.release_tag }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Load secrets from Bitwarden (SM)
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_SERVICE_TOKEN }} > SERVICE_TOKEN
            ${{ vars.BW_SECRET_ID_CLOUDFLARE_API_TOKEN }} > CLOUDFLARE_API_TOKEN

      # APP_SECRET —— **唯一的主密钥**：HMAC（退订链接 / mock 回调）+ AES-GCM
      # （网关密钥 / 商店凭据 / cf-api token）。定了就不能再换。
      - name: Load APP_SECRET from Bitwarden (SM)
        if: vars.BW_SECRET_ID_APP_SECRET != ''
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_APP_SECRET }} > APP_SECRET

      # ---- 2.1 先把这一片的 bound_at 清掉：部署窗口内不把租户放进正在换绑定的片 ----
      - name: Mark bindings stale
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            "$CF_API_BASE/api/v2/platform/shards/$SHARD/stale" | jq -c .

      # ---- 2.2 取清单 → 渲染配置 ----
      - name: Fetch manifest
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            "$CF_API_BASE/api/v2/platform/shards/$SHARD/manifest" > manifest.json
          jq -r '"\(.worker) 绑定 \(.bindings|length) 条（已分配 \(.slots|length) + 池中 \(.pooled|length)）"' manifest.json

      - name: Render wrangler.shard.jsonc
        env:
          CRM_ROOT: ${{ vars.CRM_ROOT }}
          ALLOW_MOCK_PAYMENTS: ${{ vars.ALLOW_MOCK_PAYMENTS }}
        run: node scripts/render-shard-config.mjs --manifest manifest.json

      # ---- 2.3 构建 + 部署 ----
      - run: npm ci
      - run: npm run build:web
      # 内嵌 bundle 必须与 `migrations/` 一致（分片懒升级的判据就是它）
      - run: npm run db:embed:check
      - name: Deploy worker
        run: npx wrangler deploy --config wrangler.shard.jsonc

      # ---- 2.3.1 同步 APP_SECRET（wrangler deploy 不会动 secrets）----
      - name: Sync APP_SECRET to shard
        run: |
          set -euo pipefail
          if [[ -z "${APP_SECRET:-}" ]]; then
            echo "::warning::APP_SECRET 未配置（变量 BW_SECRET_ID_APP_SECRET 未设置）—— 签名与加密都不可用"
            exit 0
          fi
          printf '%s' "$APP_SECRET" | npx wrangler secret put APP_SECRET --config wrangler.shard.jsonc
          echo "✔ APP_SECRET 已写入（值不打印）"

      # ---- 2.4 绑定回填 + 核对（**唯一可信的核对在 cf-api 里**）----
      # 502 = 回读核对没通过（缺绑定 / MODE 丢了 / ASSETS 丢了），必须让 job 失败
      - name: Reconcile bindings
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            "$CF_API_BASE/api/v2/platform/shards/$SHARD/reconcile" | jq -c .

      # 部署失败时也要把 bound_at 拉回来，否则这一片的开通会一直 409
      - name: Reconcile after failure (best effort)
        if: failure()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            "$CF_API_BASE/api/v2/platform/shards/$SHARD/reconcile" \
            | jq -c '.' || echo "::warning::reconcile 失败 —— 手工 POST /platform/shards/$SHARD/reconcile"
  # ---- 3. router 跟发 ----
  router:
    name: deploy router
    needs: [deploy, resolve]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-saas-router
      cancel-in-progress: false
    env:
      PLATFORM_VERSION: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Load secrets from Bitwarden (SM)
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_SERVICE_TOKEN }} > SERVICE_TOKEN
            ${{ vars.BW_SECRET_ID_CLOUDFLARE_API_TOKEN }} > CLOUDFLARE_API_TOKEN

      - name: Fetch summary
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            "$CF_API_BASE/api/v2/platform/shards" > shards.json
          jq -c '{shards_ready, needs_shard}' shards.json

      - name: Render wrangler.router.jsonc
        env:
          HOSTS_KV_ID: ${{ vars.HOSTS_KV_ID }}
          REGISTRY_D1_ID: ${{ vars.REGISTRY_D1_ID }}
          CRM_ROOT: ${{ vars.CRM_ROOT }}
          BASE_DOMAIN: ${{ vars.SAAS_BASE_DOMAIN || 'clever-vpn.org' }}
          PLATFORM_VERSION: ${{ needs.resolve.outputs.release_tag }}
        run: node scripts/render-router-config.mjs --input shards.json

      - run: npm ci

      - name: Deploy router
        run: npx wrangler deploy --config wrangler.router.jsonc

      - name: Smoke test (via wildcard route)
        env:
          CRM_ROOT: ${{ vars.CRM_ROOT }}
        run: |
          set -euo pipefail
          if [[ -z "${CRM_ROOT:-}" ]]; then
            echo "::notice::未配置 CRM_ROOT 变量，跳过冒烟测试"
            exit 0
          fi
          url="https://route-check.${CRM_ROOT}/__router/health"
          for i in $(seq 1 10); do
            body=$(curl -sS -m 8 "$url" || true)
            if jq -e '.ok == true' <<<"$body" >/dev/null 2>&1; then
              echo "✔ router 健康：$body"
              exit 0
            fi
            echo "第 $i 次：$body"
            sleep 3
          done
          echo "::error::router 冒烟失败（最近一次响应：$body）"
          exit 1

  # ---- 4. 全部成功后才发布版本（tag = 线上版本）----
  publish:
    name: publish version
    needs: [resolve, deploy, router]
    if: success()
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.resolve.outputs.release_tag }}
      sha: ${{ needs.resolve.outputs.sha }}
      is_new_tag: ${{ needs.resolve.outputs.is_new_tag == 'true' }}
