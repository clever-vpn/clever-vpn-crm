# 部署（CI 唯一路径）
#
# 自托管租户的用法：fork → 配 Secrets/Variables → 点 Run workflow。
# 不要求在本地 clone / 安装 / deploy；本地只用于开发调试（npm run dev）。
#
# 需要的配置（Settings → Secrets and variables → Actions）：
#   Secrets:   CLOUDFLARE_API_TOKEN（Workers Scripts:Edit + D1:Edit）
#              APP_SECRET（随机长串 ≥32：一个主密钥顶两个用途 ——
#                HMAC 一次性签名（退订链接 / webhook 回调）
#                AES-GCM 加密落库（网关密钥 / 商店凭据 / cf-api token））
#
# 注意：cf-api 的租户 token **不是** secret —— 部署后在后台「设置 → cf-api 对接」
# 里填，加密存进本租户 D1（托管分片一个 Worker 服务多个租户，部署级 secret 在
# 模型上就是错的）。
#   Variables: CRM_TENANT_ID（必填；为空则本工作流整体跳过）
#              CLOUDFLARE_ACCOUNT_ID
#              D1_NAME / WORKER_NAME / CF_API_BASE（可选，有默认值）
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-crm
  cancel-in-progress: false

jobs:
  deploy:
    # 上游仓库 / 未配置租户的 fork：直接跳过，不制造红叉
    if: ${{ vars.CRM_TENANT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ vars.WORKER_NAME || 'clever-vpn-crm' }}
      D1_NAME: ${{ vars.D1_NAME || 'clever-vpn-crm' }}
      CRM_TENANT_ID: ${{ vars.CRM_TENANT_ID }}
      CF_API_BASE: ${{ vars.CF_API_BASE || 'https://api.clever-vpn.org' }}
      # studio 票据的跳转落点（空 = 该产品未上线，签票会返回 500 studio_not_configured）
      STUDIO_SITE_URL: ${{ vars.STUDIO_SITE_URL }}
      STUDIO_APP_URL: ${{ vars.STUDIO_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 检查（typecheck + test）
        run: |
          set -euo pipefail
          npm run typecheck
          npm test

      - name: 构建管理后台（SPA）
        run: npm run build:web

      - name: 确保 D1 存在
        id: d1
        run: |
          set -euo pipefail
          find_d1() {
            npx wrangler d1 list --json | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const start = s.indexOf("[");
                const rows = start >= 0 ? JSON.parse(s.slice(start)) : [];
                const hit = rows.find((r) => r.name === process.env.D1_NAME);
                process.stdout.write(hit ? hit.uuid : "");
              });
            '
          }

          ID="$(find_d1)"
          if [ -z "$ID" ]; then
            echo "D1「${D1_NAME}」不存在，创建…"
            npx wrangler d1 create "$D1_NAME"
            ID="$(find_d1)"
          fi
          if [ -z "$ID" ]; then
            echo "::error::无法解析 D1 database_id（检查 CLOUDFLARE_API_TOKEN 是否有 D1:Edit）"
            exit 1
          fi
          echo "D1_ID=$ID" >> "$GITHUB_OUTPUT"
          echo "D1 database_id = $ID"

      - name: 渲染部署配置
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.D1_ID }}
        run: node scripts/render-config.mjs

      # 先迁移、再部署：迁移失败就别切流量。
      # 迁移文件在 `migrations/`（drizzle-kit 生成），wrangler 用 `d1_migrations`
      # 表记录已应用项，重复执行是安全的。
      # ⚠️ 数据库一旦建过表（老库）而 `d1_migrations` 为空，0000_baseline 会重复建表失败，
      #    处理方式见 docs/schema.md §4。
      - name: 应用数据库迁移
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.ci.jsonc

      - name: 部署
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.ci.jsonc 2>&1 | tee /tmp/deploy.log

      - name: 写入 Worker secrets
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          STUDIO_TICKET_MASTER: ${{ secrets.STUDIO_TICKET_MASTER }}
        run: |
          set -euo pipefail
          if [ -z "${APP_SECRET:-}" ]; then
            echo "::error::缺少 secret APP_SECRET（见 docs/self-host.md §2）"; exit 1
          fi
          printf '%s' "$APP_SECRET" | npx wrangler secret put APP_SECRET --config wrangler.ci.jsonc
          if [ -n "${SETUP_TOKEN:-}" ]; then
            printf '%s' "$SETUP_TOKEN" | npx wrangler secret put SETUP_TOKEN --config wrangler.ci.jsonc
          else
            echo "::warning::未配置 SETUP_TOKEN，管理后台首次初始化会被禁用（见 docs/admin.md）"
          fi
          # studio 身份：没有它签不出票据（site / app studio 都进不去）
          if [ -n "${STUDIO_TICKET_MASTER:-}" ]; then
            printf '%s' "$STUDIO_TICKET_MASTER" | npx wrangler secret put STUDIO_TICKET_MASTER --config wrangler.ci.jsonc
          else
            echo "::warning::未配置 STUDIO_TICKET_MASTER，studio 设计器入口不可用（见 docs/self-host.md）"
          fi

      - name: 摘要
        run: |
          set -euo pipefail
          URL="$(grep -aEo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | head -1 || true)"
          {
            echo "## CRM 已部署"
            echo ""
            echo "- Worker: \`${WORKER_NAME}\`"
            echo "- 租户: \`${CRM_TENANT_ID}\`"
            echo "- 平台: ${CF_API_BASE}"
            if [ -n "$URL" ]; then
              echo "- URL: $URL"
              echo ""
              echo '```'
              echo "curl -s ${URL}/health"
              echo "curl -s ${URL}/__version"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
