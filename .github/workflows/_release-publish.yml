# 共享：部署成功之后创建 tag + release（幂等）
#
# 不做产物：SaaS 与自托管都从源码 build，release 只是一条"版本记录"（tag + notes）。
# 需要可下载的 self-host 包时，另外加一个 workflow_dispatch 的打包流程，不挂在每次发布上。
#
# 只在 _release-tag.yml 报 is_new_tag=true 时被调用；创建在**部署过的那个 sha** 上，
# 所以 tag 永远等于线上版本。已存在则跳过（并行部署的两个 worker 不会互相打架）。
name: _release-publish

on:
  workflow_call:
    inputs:
      tag:
        description: "要创建的 tag（vX.Y.Z）"
        required: true
        type: string
      sha:
        description: "部署过的 commit"
        required: true
        type: string
      is_new_tag:
        description: "_release-tag 的输出：true 才创建"
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: publish ${{ inputs.tag }}
    if: inputs.is_new_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag and release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，跳过创建"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
          fi

