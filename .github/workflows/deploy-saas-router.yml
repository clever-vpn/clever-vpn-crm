# 部署 **SaaS router** —— 租户后台域的入口（`{slug}.{CRM_ROOT}` / `crm.brand.com`）
#
# 它只做 Host → KV → 转发到对应 shard 的 service binding。片数变化时必须重新跑本
# workflow（service binding 是部署期静态的）。
#
# 契约：clever-vpn-docs/docs/contracts/site-hosting.md §1.1 / §2
name: deploy-saas-router

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "审计备注"
        required: false
        default: "manual"
        type: string
  schedule:
    # 每周一次：加片后忘了手动跑，最多一周自动跟上
    - cron: "37 4 * * 1"

permissions:
  contents: read

env:
  CF_API_BASE: https://api.clever-vpn.org

jobs:
  deploy:
    name: deploy router
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-saas-router
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Load secrets from Bitwarden (SM)
        uses: bitwarden/sm-action@v3.0.0
        with:
          access_token: ${{ secrets.BW_SM_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_SERVICE_TOKEN }} > SERVICE_TOKEN
            ${{ vars.BW_SECRET_ID_CLOUDFLARE_API_TOKEN }} > CLOUDFLARE_API_TOKEN

      - name: Fetch shard list
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            -H "Authorization: Bearer $SERVICE_TOKEN" \
            "$CF_API_BASE/api/v2/platform/shards" > shards.json
          jq -r '"分片：\([.shards[]? | "shard-\(.shard)(deployed=\(.deployed))"] | join(", "))"' shards.json

      - name: Render wrangler.router.jsonc
        env:
          HOSTS_KV_ID: ${{ vars.HOSTS_KV_ID }}
        run: node scripts/render-router-config.mjs --input shards.json

      - run: npm ci

      - name: Deploy router
        run: npx wrangler deploy --config wrangler.router.jsonc

      # 冒烟测试走**真实域名**（任意子域都命中通配 route），不依赖额外变量：
      # 这一步能抓到"部署上去的不是 router（比如 main 写错）"这类事故。
      - name: Smoke test (via wildcard route)
        env:
          CRM_ROOT: ${{ vars.CRM_ROOT }}
        run: |
          set -euo pipefail
          if [[ -z "${CRM_ROOT:-}" ]]; then
            echo "::notice::未配置 CRM_ROOT 变量，跳过冒烟测试"
            exit 0
          fi
          url="https://route-check.${CRM_ROOT}/__router/health"
          for i in $(seq 1 10); do
            body=$(curl -sS -m 8 "$url" || true)
            if jq -e '.ok == true' <<<"$body" >/dev/null 2>&1; then
              echo "✔ router 健康：$body"
              exit 0
            fi
            echo "第 $i 次：$body"
            sleep 3
          done
          echo "::error::router 冒烟失败（最近一次响应：$body）—— 检查 main 是否指向 workers/router/src/index.ts"
          exit 1
