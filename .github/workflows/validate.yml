name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check:migrations` 的"不可变"段要和最近一次发布 tag 比对；浅克隆里没有 tag，
          # 那样检查会静默跳过（等于没守）。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: 迁移链自检（结构 / 不可变 / 与 schema 同步）
        run: npm run check:migrations
      - run: npm test
      - name: 构建管理后台（校验前端可编译）
        run: npm run build:web
