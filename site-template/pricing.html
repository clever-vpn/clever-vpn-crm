<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>套餐 · {{site.name}}</title>
    <meta name="description" content="{{site.tagline}}" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap bar">
        <a class="brand" href="index.html">
          <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.6" />
            <path d="M3.2 12h17.6M12 2.9c4.2 3.4 4.2 14.8 0 18.2M12 2.9c-4.2 3.4-4.2 14.8 0 18.2"
                  stroke="currentColor" stroke-width="1.2" opacity=".55" />
            <path d="M13.4 7.6 9.6 12.6h2.7l-1.7 3.9 4-5.2h-2.8l1.6-3.7Z" fill="currentColor" />
          </svg>
          <span>{{site.name}}</span>
        </a>
        <nav>
          <a href="index.html#features">特性</a>
          <a href="pricing.html" class="active">套餐</a>
          <a href="download.html">下载</a>
          <a href="account.html">我的</a>
        </nav>
        <a class="btn sm" href="download.html">下载客户端</a>
      </div>
    </header>

    <main class="wrap">
      <h1>选一个套餐</h1>
      <p class="lead">
        价格与权益以这里为准；随时可以升到更大的套餐，差价按未用完的部分折算。
      </p>

      <div id="flash"></div>
      <div id="plans" class="plans">
        <div class="card"><div class="spinner-note">正在加载套餐…</div></div>
      </div>

      <div class="card soft" style="margin-top:22px">
        <h2>付款与退款</h2>
        <p class="hint" style="margin:0">
          付款成功后权益立即到账。未使用流量可在 7 天内申请退款，详见
          <a href="legal/terms.html">服务条款</a>。
        </p>
      </div>
    </main>

    <footer class="site">
      <div class="wrap">
        <div class="cols">
          <div>
            <div class="brand">{{site.name}}</div>
            <p>{{site.tagline}}</p>
            <p><a data-if="site.contact_email" href="mailto:{{site.contact_email}}">联系我们</a></p>
          </div>
          <div>
            <h4>产品</h4>
            <ul>
              <li><a href="pricing.html">套餐与价格</a></li>
              <li><a href="download.html">下载客户端</a></li>
              <li><a href="account.html">我的账号</a></li>
            </ul>
          </div>
          <div>
            <h4>条款</h4>
            <ul>
              <li><a href="legal/terms.html">服务条款</a></li>
              <li><a href="legal/privacy.html">隐私政策</a></li>
            </ul>
          </div>
        </div>
        <div class="legal">
          <span>{{site.footer}}</span>
          <span>支付与订阅服务由本网站提供</span>
        </div>
      </div>
    </footer>

    <script src="config.js"></script>
    <script src="/_crm/sdk.js"></script>
    <script src="pricing.js"></script>

  </body>
</html>
