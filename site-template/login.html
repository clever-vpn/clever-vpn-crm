<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · {{site.name}}</title>
    <meta name="description" content="{{site.tagline}}" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap bar">
        <a class="brand" href="index.html">
          <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.6" />
            <path d="M3.2 12h17.6M12 2.9c4.2 3.4 4.2 14.8 0 18.2M12 2.9c-4.2 3.4-4.2 14.8 0 18.2"
                  stroke="currentColor" stroke-width="1.2" opacity=".55" />
            <path d="M13.4 7.6 9.6 12.6h2.7l-1.7 3.9 4-5.2h-2.8l1.6-3.7Z" fill="currentColor" />
          </svg>
          <span>{{site.name}}</span>
        </a>
        <nav>
          <a href="index.html#features">特性</a>
          <a href="pricing.html">套餐</a>
          <a href="download.html">下载</a>
          <a href="account.html">我的</a>
        </nav>
        <a class="btn sm" href="pricing.html">查看套餐</a>
      </div>
    </header>

    <main class="wrap">
      <div class="narrow" style="margin:0 auto">
        <h1>登录 / 注册</h1>
        <p class="lead">
          只需邮箱，无需密码。同一个账号在 App 里也能用。
        </p>

        <div class="card stack">
          <div>
            <label class="inline" style="display:block;margin-bottom:7px">邮箱</label>
            <div class="row">
              <input id="email" class="grow" type="email" placeholder="you@example.com" autocomplete="email" />
              <button id="send" type="button" class="ghost">发送验证码</button>
            </div>
          </div>
          <div id="devcode" class="hint" hidden></div>
          <div>
            <label class="inline" style="display:block;margin-bottom:7px">验证码</label>
            <div class="row">
              <input id="code" class="grow" type="text" placeholder="6 位验证码" inputmode="numeric" maxlength="6" />
              <button id="verify" type="button">登录</button>
            </div>
          </div>
          <div>
            <label class="inline" style="display:block;margin-bottom:7px">邀请码（选填）</label>
            <input id="ref" class="grow" style="width:100%" type="text" placeholder="朋友给你的码" />
            <p class="hint" style="margin:8px 0 0">
              填了才有归因与首单奖励，不填照样注册。
            </p>
          </div>
          <div id="flash"></div>
        </div>

        <p class="hint" style="margin-top:16px">
          继续即表示你同意 <a href="legal/terms.html">服务条款</a> 与
          <a href="legal/privacy.html">隐私政策</a>。
        </p>
      </div>
    </main>

    <footer class="site">
      <div class="wrap">
        <div class="cols">
          <div>
            <div class="brand">{{site.name}}</div>
            <p>{{site.tagline}}</p>
            <p><a data-if="site.contact_email" href="mailto:{{site.contact_email}}">联系我们</a></p>
          </div>
          <div>
            <h4>产品</h4>
            <ul>
              <li><a href="pricing.html">套餐与价格</a></li>
              <li><a href="download.html">下载客户端</a></li>
              <li><a href="account.html">我的账号</a></li>
            </ul>
          </div>
          <div>
            <h4>条款</h4>
            <ul>
              <li><a href="legal/terms.html">服务条款</a></li>
              <li><a href="legal/privacy.html">隐私政策</a></li>
            </ul>
          </div>
        </div>
        <div class="legal">
          <span>{{site.footer}}</span>
          <span>支付与订阅服务由本网站提供</span>
        </div>
      </div>
    </footer>

<script src="config.js"></script>
      <script src="api.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const flash = (kind, text) => {
        $('flash').innerHTML = text ? `<div class="${kind}">${text}</div>` : '';
      };
      const next = () => {
        const n = new URLSearchParams(location.search).get('next');
        // 只接受站内路径，避免开放重定向
        return n && !n.startsWith('//') ? n : 'account.html';
      };

      async function post(path, body) {
        const res = await fetch(`${API_BASE}/api/app/v1${path}`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error?.message || data?.error?.code || `HTTP ${res.status}`);
        return data;
      }

      // 分享链接形如 /login?ref=FRIEND-A1B2 ：预填，但**不隐藏**输入框，
      // 用户可以看见并改掉（iOS 拿不到 deferred deep link，只能靠这条路）
      const refFromUrl = new URLSearchParams(location.search).get('ref');
      if (refFromUrl) $('ref').value = refFromUrl.trim().toUpperCase();

      $('send').addEventListener('click', async () => {
        flash('', '');
        const email = $('email').value.trim();
        if (!email) return flash('err', '先填邮箱');
        $('send').disabled = true;
        try {
          const r = await post('/auth/send-code', { email });
          if (r.code) {
            $('devcode').hidden = false;
            $('devcode').textContent = `开发环境回显验证码：${r.code}`;
            $('code').value = r.code;
          } else {
            $('devcode').hidden = true;
            flash('ok', '验证码已发送，请查收邮件');
          }
        } catch (e) {
          flash('err', e.message);
        } finally {
          $('send').disabled = false;
        }
      });

      $('verify').addEventListener('click', async () => {
        flash('', '');
        const email = $('email').value.trim();
        const code = $('code').value.trim();
        const ref = $('ref').value.trim();
        try {
          // 静态站与 CRM 不同源 ⇒ 不用 Cookie，把 token 存进 localStorage，
          // 之后 api.js 会给每个打到 CRM 的请求补 Authorization
          const r = await post('/auth/verify', {
            email,
            code,
            appId: 'website',
            ...(ref ? { referral_code: ref } : {}),
          });
          if (r.session_token) CrmAuth.set(r.session_token);
          location.assign(next());
        } catch (e) {
          flash('err', e.message);
        }
      });
    </script>

  </body>
</html>
