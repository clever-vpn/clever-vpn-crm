<!doctype html>
<html lang="zh-CN" class="{{site.theme.preset}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · {{site.name}}</title>
    <meta name="description" content="{{site.tagline}}" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body class="auth">
    <main class="auth-page">
      <div class="auth-top">
        <a class="auth-home" href="index.html">← 返回 {{site.name}}</a>
      </div>

      <div class="auth-card">
        <a class="auth-logo" href="index.html" aria-label="{{site.name}}">
          <img src="assets/logo.png" alt="" width="56" height="56" />
        </a>

        <h1 class="auth-title">登录</h1>

        <div id="devcode" class="hint" hidden></div>

        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label for="code">验证码</label>
          <div class="row">
            <input id="code" class="ctl grow" type="text" placeholder="6 位数字"
                   inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
            <button id="send" class="btn ghost" type="button">发送验证码</button>
          </div>
        </div>

        <button id="verify" class="btn" type="button">登录</button>

        <div id="flash"></div>

        <div class="field auth-invite">
          <label for="ref">邀请码（选填）</label>
          <input id="ref" type="text" placeholder="朋友给你的码" />
        </div>

        <p class="auth-foot">
          继续即表示你同意 <a href="legal/terms.html">服务条款</a> 与
          <a href="legal/privacy.html">隐私政策</a>。
        </p>
      </div>

      <div class="auth-legal">{{site.footer}}</div>
    </main>

    <script src="/_crm/config.js"></script>
    <script src="/_crm/sdk.js"></script>
    <script src="login.js"></script>
  </body>
</html>
