<!doctype html>
<html lang="zh-CN" class="{{site.theme.preset}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · {{site.name}}</title>
    <meta name="description" content="{{site.tagline}}" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body class="auth">
    <main class="auth-page">
      <div class="auth-top">
        <a class="auth-home" href="index.html">← 返回 {{site.name}}</a>
      </div>

      <div class="auth-card">
        <a class="auth-logo" href="index.html" aria-label="{{site.name}}">
          <img src="assets/logo.png" alt="" width="56" height="56" />
        </a>

        <h1 class="auth-title">登录</h1>
        <p class="auth-sub">用邮箱收验证码登录，不需要密码。</p>

        <div id="flash"></div>
        <div id="devcode" class="hint" hidden></div>

        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div id="code-wrap" hidden>
          <div class="field">
            <label for="code">验证码</label>
            <input id="code" type="text" placeholder="6 位数字" inputmode="numeric"
                   maxlength="6" autocomplete="one-time-code" />
          </div>
        </div>

        <button id="send" class="btn" type="button">发送验证码</button>

        <div class="auth-alt" id="alt" hidden>
          <button id="again" class="linkish" type="button" disabled>重新发送</button>
          <button id="back" class="linkish" type="button">换个邮箱</button>
        </div>

        <details class="auth-extra">
          <summary>有邀请码？</summary>
          <div class="field" style="margin-top: var(--sp-3)">
            <label for="ref">邀请码（选填）</label>
            <input id="ref" type="text" placeholder="朋友给你的码" />
            <div class="hint">填了才有归因与首单奖励，不填照样登录。</div>
          </div>
        </details>

        <p class="auth-foot">
          继续即表示你同意 <a href="legal/terms.html">服务条款</a> 与
          <a href="legal/privacy.html">隐私政策</a>。
        </p>
      </div>

      <div class="auth-legal">{{site.footer}}</div>
    </main>

    <script src="/_crm/config.js"></script>
    <script src="/_crm/sdk.js"></script>
    <script src="login.js"></script>
  </body>
</html>
