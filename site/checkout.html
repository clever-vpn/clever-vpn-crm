<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>确认订单 · Clever VPN</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap">
        <a class="brand" href="/">Clever VPN</a>
        <nav>
          <a href="/pricing" class="active">套餐</a>
          <a href="/account">我的</a>
        </nav>
      </div>
    </header>

    <main class="wrap" style="max-width: 520px">
      <h1>确认订单</h1>
      <p class="lead">金额与有效期由服务端报价给出，这里只确认一次。</p>
      <div id="flash"></div>

      <section class="card">
        <dl id="summary" class="kv"></dl>
        <div class="row" style="margin-top:16px">
          <label class="hint">支付方式</label>
          <select id="method" class="grow"></select>
        </div>
        <div class="row" style="margin-top:16px">
          <button id="pay">去支付</button>
          <a class="btn ghost" href="/pricing">返回</a>
        </div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const yuan = (m) => (m === null || m === undefined ? '—' : `¥${(m / 100).toFixed(2)}`);
      const flash = (kind, text) => {
        $('flash').innerHTML = text ? `<div class="${kind}">${text}</div>` : '';
      };
      const planId = new URLSearchParams(location.search).get('plan') || '';
      let quote = null;

      async function api(path, init = {}) {
        const res = await fetch(`/api/app/v1${path}`, { credentials: 'same-origin', ...init });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          // 结账页不强制先登录：提交时才要求验证邮箱（契约 §2.8.1）
          location.assign(`/login?next=${encodeURIComponent(`/checkout?plan=${planId}`)}`);
          throw new Error('unauthorized');
        }
        if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
        return data;
      }

      (async () => {
        if (!planId) {
          flash('err', '缺少套餐参数');
          return;
        }
        try {
          const plans = await api('/plans');
          const plan = plans.find((p) => p.plan_id === planId);
          if (!plan) throw new Error('套餐不存在或已下架');

          quote = await api('/quote', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ plan_id: planId }),
          });
          if (!quote.allowed) throw new Error(quote.reason || '当前不可购买');

          const rows = {
            套餐: plan.name,
            动作: { buy: '新购', renewal: '续订', upgrade: '升级' }[quote.action] ?? quote.action,
            标价: yuan(quote.price_minor),
            残值抵扣: quote.residual_minor ? `−${yuan(quote.residual_minor)}` : '—',
            应付: yuan(quote.payable_minor),
            买后有效期至: quote.expires_at ? String(quote.expires_at).slice(0, 10) : '—',
          };
          $('summary').innerHTML = Object.entries(rows)
            .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`)
            .join('');

          const methods = await api('/payment-methods');
          $('method').innerHTML = methods.length
            ? methods.map((m) => `<option value="${m.id}">${m.label}</option>`).join('')
            : '<option value="">（无可用支付方式）</option>';
        } catch (e) {
          if (e.message !== 'unauthorized') flash('err', e.message);
        }
      })();

      $('pay').addEventListener('click', async () => {
        flash('', '');
        const method = $('method').value;
        if (!method) return flash('err', '没有可用的支付方式');
        if (!quote) return flash('err', '报价还没加载好');
        $('pay').disabled = true;
        try {
          const order = await api('/orders', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              plan_id: planId,
              payment_method: method,
              expected_payable_minor: quote.payable_minor,
              // origin 区分下单入口（web / app），不参与计价
              origin: 'web',
            }),
          });
          location.assign(order.pay_url);
        } catch (e) {
          flash('err', e.message);
          $('pay').disabled = false;
        }
      });
    </script>
  </body>
</html>
