<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的 · Clever VPN</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap">
        <a class="brand" href="/">Clever VPN</a>
        <nav>
          <a href="/pricing">套餐</a>
          <a href="/account" class="active">我的</a>
          <a href="#" id="logout">退出</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <h1>我的</h1>
      <!-- 与 App 是同一个 /me 响应：文案（status_text）也来自服务端 -->
      <p class="lead">这里的权益与 App 里显示的完全一致。</p>
      <div id="flash"></div>

      <section class="card">
        <div class="row" style="justify-content:space-between">
          <h2 style="margin:0">当前权益</h2>
          <span id="state-tag" class="tag"></span>
        </div>
        <dl id="me" class="kv" style="margin-top:14px"></dl>
        <div class="row" style="margin-top:16px">
          <a class="btn" href="/pricing">续费 / 升级</a>
          <a class="btn ghost" href="/download">下载 App</a>
        </div>
      </section>

      <section class="card" style="margin-top:18px">
        <div class="row" style="justify-content:space-between">
          <h2 style="margin:0">兑换码</h2>
          <span class="tag">有码就能领</span>
        </div>
        <p class="hint" style="margin:10px 0 0">
          拿到活动码 / 渠道福利码后在这里输入。兑换的权益会直接加到当前账号上。
        </p>
        <div class="row" style="margin-top:14px">
          <input id="redeem-code" class="grow" type="text" autocomplete="off" spellcheck="false"
                 placeholder="输入兑换码，例如 GUOQING7"
                 style="text-transform:uppercase;letter-spacing:1px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">
          <button id="redeem-btn" class="btn" type="button">兑换</button>
        </div>
        <div id="redeem-result" style="margin-top:12px"></div>
      </section>

      <section class="card" style="margin-top:18px">
        <div class="row" style="justify-content:space-between">
          <h2 style="margin:0">邀请好友</h2>
          <span id="invite-count" class="tag"></span>
        </div>
        <p class="hint" style="margin:10px 0 0">
          把码发给朋友，他在注册时（选填）填上即可。奖励只给权益，不提现。
        </p>
        <div class="row" style="margin-top:14px">
          <code id="invite-code" class="mono grow" style="font-size:18px;letter-spacing:1px">—</code>
          <button id="copy" class="btn ghost" type="button">复制</button>
        </div>
        <dl id="invite" class="kv" style="margin-top:14px"></dl>
      </section>

      <section class="card" style="margin-top:18px">
        <h2 style="margin-top:0">订单</h2>
        <table>
          <thead>
            <tr><th>单号</th><th>套餐</th><th>金额</th><th>状态</th><th>时间</th></tr>
          </thead>
          <tbody id="orders"><tr><td colspan="5" class="hint">加载中…</td></tr></tbody>
        </table>
      </section>
    </main>

    <footer class="site">
      <div class="wrap">
        <a href="/legal/terms">服务条款</a> · <a href="/legal/privacy">隐私政策</a>
      </div>
    </footer>

    <script>
      const $ = (id) => document.getElementById(id);
      const yuan = (m) => (m === null || m === undefined ? '—' : `¥${(m / 100).toFixed(2)}`);
      const flash = (kind, text) => {
        $('flash').innerHTML = text ? `<div class="${kind}">${text}</div>` : '';
      };
      const fmtDate = (iso) => (iso ? String(iso).slice(0, 10) : '—');

      const STATUS_TAG = {
        active: ['ok', '可用'],
        inactive: ['warn', '不可用'],
        provisioning: ['warn', '开通中'],
        none: ['warn', '未订阅'],
      };

      async function api(path, init = {}) {
        const res = await fetch(`/api/app/v1${path}`, { credentials: 'same-origin', ...init });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          location.assign('/login?next=/account');
          throw new Error('unauthorized');
        }
        if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
        return data;
      }

      function renderMe(me) {
        const s = me.subscription || {};
        const [cls, label] = STATUS_TAG[s.status] ?? ['warn', s.status ?? '—'];
        $('state-tag').className = `tag ${cls}`;
        $('state-tag').textContent = label;

        const rows = {
          账号: me.user.email,
          // 契约：状态只有 active / inactive，具体原因与文案都由服务端给
          状态: s.status === 'provisioning' ? '正在开通…' : (s.status_text ?? '—'),
          套餐: s.plan_id ?? '—',
          到期: fmtDate(s.expires_at),
          剩余额度: s.unlimited ? '不限量' : (s.remaining_gb === null || s.remaining_gb === undefined ? '—' : `${s.remaining_gb} GB`),
          设备数: s.licence_limit ?? '—',
        };
        if (s.status === 'inactive' && s.reason === 'frozen') {
          rows['提示'] = '如需恢复，请联系客服';
        }
        // 激活码**不展示**：它只在 App 内部持有（契约 §2.3）
        $('me').innerHTML = Object.entries(rows)
          .map(([k, v]) => `<dt>${k}</dt><dd>${String(v)}</dd>`)
          .join('');
      }

      function renderReferral(ref) {
        if (!ref) return;
        $('invite-code').textContent = ref.code || '生成失败，请联系客服';
        $('invite-count').className = 'tag';
        $('invite-count').textContent = `已邀请 ${ref.invited} 人`;
        const rows = {
          已邀请: `${ref.invited} 人（已完成首单）`,
          累计奖励: [
            ref.reward_days ? `${ref.reward_days} 天` : '',
            ref.reward_gb ? `${ref.reward_gb} GB` : '',
          ].filter(Boolean).join(' + ') || '—',
        };
        $('invite').innerHTML = Object.entries(rows)
          .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`)
          .join('');
      }

      $('copy').addEventListener('click', async () => {
        const code = $('invite-code').textContent || '';
        if (!code || code === '—') return;
        try {
          await navigator.clipboard.writeText(code);
          flash('ok', `已复制邀请码 ${code}`);
        } catch {
          // 非 https / 无权限时就地选中，让用户自己复制
          const range = document.createRange();
          range.selectNodeContents($('invite-code'));
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          flash('err', '复制失败，请手动选中上面的码');
        }
      });


      // ── 兑换码（契约 §2.9.7）──
      //   业务性失败是 200 + ok:false + reason（不是异常），所以要按 ok 判断。
      const redeemDone = (payload) => {
        const bits = [];
        const a = payload.applied || {};
        if (a.days) bits.push(`+${a.days} 天`);
        if (a.gb) bits.push(`+${a.gb} GB`);
        if (a.reset_month) bits.push('重置本月已用');
        const head = payload.opened ? '已开通体验套餐' : `「${payload.promotion_name}」已到账`;
        const detail = bits.length ? `：${bits.join(' + ')}` : '';
        const tail = payload.expires_at ? `，有效期至 ${fmtDate(payload.expires_at)}` : '';
        return `${head}${detail}${tail}`;
      };

      $('redeem-btn').addEventListener('click', async () => {
        const code = ($('redeem-code').value || '').trim().toUpperCase();
        const box = $('redeem-result');
        if (!code) {
          box.innerHTML = '<div class="err">请输入兑换码</div>';
          return;
        }
        $('redeem-btn').disabled = true;
        box.innerHTML = '<div class="hint">正在兑换…</div>';
        try {
          const res = await fetch('/api/app/v1/redeem', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 401) {
            location.assign('/login?next=/account');
            return;
          }
          if (res.status === 429) {
            box.innerHTML = `<div class="err">${data?.message || '试得太频繁了，请稍后再试'}</div>`;
            return;
          }
          if (data.ok) {
            box.innerHTML = `<div class="ok">${redeemDone(data)}</div>`;
            $('redeem-code').value = '';
            renderMe(await api('/me'));   // 权益变了，立刻刷新上面那张卡
          } else {
            box.innerHTML = `<div class="err">${data.reason || '兑换失败'}</div>`;
          }
        } catch (e) {
          box.innerHTML = `<div class="err">兑换失败：${e.message}</div>`;
        } finally {
          $('redeem-btn').disabled = false;
        }
      });

      function renderOrders(payload) {
        const items = payload.items ?? [];
        const body = $('orders');
        if (!items.length) {
          body.innerHTML = '<tr><td colspan="5" class="hint">还没有订单</td></tr>';
          return;
        }
        body.innerHTML = items.map((o) => `
          <tr>
            <td class="mono">${o.order_code ?? o.code ?? '—'}</td>
            <td>${o.plan_id ?? '—'}</td>
            <td>${yuan(o.amount_minor)}</td>
            <td>${o.status ?? '—'}</td>
            <td>${fmtDate(o.created_at)}</td>
          </tr>
        `).join('');
      }

      $('redeem-code').addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') $('redeem-btn').click();
      });

      (async () => {
        try {
          const me = await api('/me');
          renderMe(me);
          renderReferral(me.referral);
          renderOrders(await api('/orders?pagination[limit]=20'));
        } catch (e) {
          if (e.message !== 'unauthorized') flash('err', `加载失败：${e.message}`);
        }
      })();

      $('logout').addEventListener('click', async (ev) => {
        ev.preventDefault();
        try {
          await fetch('/api/app/v1/auth/logout', { method: 'POST', credentials: 'same-origin' });
        } finally {
          location.assign('/');
        }
      });
    </script>
  </body>
</html>
