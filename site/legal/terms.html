    <title>服务条款 · Clever VPN</title>
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap">
        <a class="brand" href="/">Clever VPN</a>
        <nav><a href="/pricing">套餐</a><a href="/account">我的</a></nav>
      </div>
    </header>
    <main class="wrap" style="max-width: 720px">
      <h1>服务条款</h1>
      <div class="card">
        <p class="hint">
          占位文本：上架 App Store / Google Play 时必须提供真实的《服务条款》链接。
          请租户在部署前替换本页内容（账号规则、退款政策、禁止用途、服务可用性说明等）。
        </p>
        <h2>1. 服务内容</h2>
        <p>本服务提供网络加速/隧道能力，具体套餐、额度与有效期以购买页与订单为准。</p>
        <h2>2. 账号</h2>
        <p>账号以邮箱标识，一个邮箱对应一个账号；请勿与他人共用账号。</p>
        <h2>3. 付款与退款</h2>
        <p>付款成功后即时开通；退款规则以运营方公布的政策为准。</p>
        <h2>4. 禁止用途</h2>
        <p>禁止用于任何违反所在地法律法规的用途。</p>
      </div>
    </main>
    <footer class="site"><div class="wrap"><a href="/legal/privacy">隐私政策</a></div></footer>
